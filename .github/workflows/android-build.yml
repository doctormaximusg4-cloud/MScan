name: Build MScan Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Cordova
        run: npm install -g cordova@latest

      - name: Add Android platform
        run: cordova platform add android@15.1.0

        - name: Add MScan native plugins
        run: |
         cordova plugin add ./plugins-src/mscan-magnetometer
         cordova plugin add ./plugins-src/mscan-camera

      - name: Build MScan APK
        run: cordova build android --debug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk dist/MScan-v0.1-debug.apk

      - name: Upload MScan APK
        uses: actions/upload-artifact@v4
        with:
          name: MScan-Android-APK
          path: dist/MScan-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
