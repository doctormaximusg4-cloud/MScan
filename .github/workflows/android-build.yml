name: Reset MScan from ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild repository from clean ZIP
        run: |
          mkdir /tmp/mscan
          unzip MScan_v1_CLEAN.zip -d /tmp/mscan

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "MScan_v1_CLEAN.zip" \
            -exec rm -rf {} +

          cp -a /tmp/mscan/. .
          rm -f MScan_v1_CLEAN.zip

      - name: Commit clean project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Reset MScan to clean v1" || exit 0
          git push
